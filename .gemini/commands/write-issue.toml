description = "Writes the description and Acceptance criteria of a GitHub issue — feature request or bug report — from a design doc, a bug report or requirements, verified against the codebase"

prompt = """
You are writing the **description** and the **Acceptance criteria** of a Site Kit issue for {{args}} — a path to a design doc, a bug report, requirements stated in the user's message, or an existing GitHub issue in google/site-kit-wp that needs acceptance criteria. If nothing usable was given, ask for it before doing anything else.

The canonical, tool-agnostic procedure is `docs/context/workflow/write-issue.md`. Read it and follow it exactly; the phases below are the same steps, and the playbook wins on any detail.

--- CRITICAL INSTRUCTIONS ---

- ASK THE USER whether they want a feature request or a bug report whenever their message does not make it clear, and WAIT for the answer before writing anything. The two use different templates and different description sections.
- Write ONLY the description sections for the type and the Acceptance criteria. Leave Implementation Brief, Test Coverage, QA Brief and Changelog entry as the template's placeholder comments.
- If the issue ALREADY has its description written — a Feature Description, or a Bug Description with its Steps to reproduce — write ONLY the Acceptance criteria and leave the description byte-for-byte unchanged, unless the user explicitly asks you to change it.
- DO NOT run `gh issue create` or `gh issue edit`, and DO NOT post a comment, unless the user explicitly asks. Produce the markdown file and let the user place it.
- DO NOT name any class, method, hook, handle or path you have not opened and read.
- DO NOT put links or paths to local design docs or spec files in any section you write — they do not resolve on GitHub.
- DO NOT refer to a sibling issue by its position in the design doc ("issue 5", "the next issue"). That numbering is not GitHub's and will be wrong. Use a real issue number, or the name of the deliverable.

--- PHASE 1: ESTABLISH THE ISSUE TYPE ---

There are two templates, and the type decides which sections you write:

- FEATURE REQUEST — `.github/ISSUE_TEMPLATE/feature_request.md`: the Feature Description and the Acceptance criteria.
- BUG REPORT — `.github/ISSUE_TEMPLATE/bug_report.md`: the Bug Description, the Steps to reproduce and the Acceptance criteria.

Take the type from what the user asked for. A design doc, a new event, a new component, a new setting, "add", "support" — feature request. A wrong value, a value that is never sent, a console error, a state the plugin renders when it should not, something that used to work and no longer does, "broken", "fix" — bug report.

ASK the user which type they want whenever it is not clear from their message, and wait for the answer. Say which way you read the request when you ask, so they can correct it in one word. A request to change behavior that works the way it was designed to work is a feature request, not a bug, even when the user calls it a fix — point that out when you ask.

When the source is an existing issue, its type is already decided: read the issue and match it. Do not convert one type into the other.

--- PHASE 2: ESTABLISH THE SOURCE AND THE MODE ---

The source is a design doc (a repo path or a hosted doc), a bug report or requirements written in the user's message, or an existing issue (`!{gh issue view {{args}} --json title,body}`, or a local path the user supplies — never go looking for one).

Two modes: a NEW issue gets the description sections and the criteria; an EXISTING issue whose description is already written gets ONLY the criteria.

STOP and ask the user if no source material was given, if the requirements are ambiguous or contradictory, or if the design doc covers an epic and the user has not said which issue to write. Never invent a path to a design doc.

If the design doc has a work-estimate table of proposed issues, that table IS the breakdown — one issue per row, with its title and points. Do not re-slice it.

--- PHASE 3: READ THE SOURCE MATERIAL END TO END ---

Read the WHOLE design doc, not just this issue's section — the reasoning behind one issue's decisions routinely sits in Alternatives considered, Quality attributes, Technical debt or Dependencies. Read any sibling spec the design doc names as authoritative; where that spec and the design doc disagree on what is built, the spec wins. Read the sibling issues already written for the epic — they set the level of detail and show where this issue's scope stops.

For a bug, read the whole report as the user gave it — plugin version, module state, browser, the exact values they saw — plus whatever it names as evidence: a support thread, a linked issue, or the pull request the user says introduced the problem.

--- PHASE 4: VERIFY AGAINST THE CODE ---

Open the files the issue will touch. Confirm every class, method, constant, hook, filter, option, script handle and path exists and is spelled exactly right; confirm the base class, registry or filter being extended has the shape the design doc claims; identify who CONSUMES the data the issue changes, which is what makes a "must stay unchanged" criterion real rather than imagined; and confirm that behavior the design doc treats as already existing actually exists.

For a bug, confirm that the wrong behavior is really what the code does today. Read until you can point at the lines that produce the symptom, and check which cases served by the same code still work. When you cannot find the symptom in the code, say so in Phase 8 instead of writing the issue around it.

Where the code contradicts the design doc, the code wins.

--- PHASE 5: LAY THE ISSUE OUT ---

Copy the template file for the type from Phase 1 — the file IS the layout, so do not reproduce it from memory or reorder its sections. Make two changes and no others: drop the YAML frontmatter (the `name:` and `about:` lines between the `---` markers), and put the title in its place as a single `# ` heading at the top. Everything else stays exactly as the file has it, including the `Do not alter or remove anything below` moderator notice and the placeholder comment in every section you are not writing. The two templates word their placeholders differently, so copy them from the file for the type you are writing.

On a bug report, Screenshots and Additional Context are the reporter's evidence, not yours: leave both as the template gives them, and fill in only the environment facts the user actually stated. Never invent a version number, an operating system or a device, and never describe a screenshot you have not seen.

The title names the deliverable, not the activity — lead with the symbol or event produced, then the scope in a short clause. For a bug, name the symptom and where it happens, in the same shape. Nothing sits between the title and the first description heading — no epic name, no point estimate, no dependency line. Where the issue depends on another, that dependency is a clause inside the description, by REAL GitHub issue number.

--- PHASE 6: WRITE THE DESCRIPTION ---

Prose paragraphs. This is the ONLY place where rationale belongs.

FEATURE DESCRIPTION: open with the gap — what happens today and where it falls short, naming the concrete thing that does not cover the case. State what this issue adds in one sentence. Break the work into halves with bold run-in headings when it has more than one (server + frontend, two surfaces, markup + asset). Carry over the load-bearing decisions the design doc made, and their reasons — the constraint an acceptance criterion compresses into one line.

BUG DESCRIPTION: short prose, three things in order — what the plugin does today that is wrong, as someone sees it on the real surface (the widget, the page, the event, the API response, the option value), with the wrong value and the value expected instead; what should happen instead, in one sentence; and when it happens — which module is connected, which user role, which date range, which setting value, which screen size, which browser, and whether it happens every time. Add the cause in ONE clause only when you verified it in the code in Phase 4, and never prescribe the fix — that is the Implementation Brief's job. Say whether the same wrong behavior reaches anywhere else served by the same code, and whether this issue covers it.

STEPS TO REPRODUCE: a numbered list a tester follows with nothing but the plugin. Start from a state they can reach (a fresh install, a connected module, a setting at a named value) and make that step 1 when the bug needs it. One action per step, with the real thing to click, type or paste — "Set the date range to `Last 28 days`", not "choose a date range". The last step is the observation: what the tester sees and what they should have seen instead. No mechanism — no "check the store", no breakpoints — unless the symptom cannot be seen any other way, in which case give the exact thing to open and the exact value to look at.

No bullets of criteria, no implementation instructions, no file trees, in either type.

--- PHASE 7: WRITE THE ACCEPTANCE CRITERIA ---

A flat list of `*` bullets. Bold run-in group labels only when the issue has genuinely separate halves. One outcome per bullet; nest a second level when one outcome has an enumerable set of cases (the conditions a hook must not fire under, the values a param may take, the forms excluded from a match rule). Inline a table when a criterion enumerates a lookup that prose would obscure — never link out to it.

Each bullet states an outcome that can be checked by reading the diff or exercising the feature. Lead with the precondition when the behavior is conditional. Name the real symbol — event name, config key, inline-data global, CSS selector, param names, hook, class. Give the values (`viewContext: 'mainDashboard'`, `dateRange: 'last-28-days'`, `limit: 3`). State cardinality when it matters ("at most once per request", "exactly one of the four states"). Say what must stay unchanged when the change touches shared code, naming the consumers.

ON A BUG REPORT the criteria are the corrected behavior, not the bug: write the outcome the reproduction steps must produce once the issue is done ("the tile shows the audience's 412 users"), never "the tile no longer shows `Gathering data` incorrectly", which cannot be graded. Then write the cases that already work and run through the same code, so the fix cannot trade one symptom for another. The cause and the fix stay out.

CUT from the criteria:
- rationale — no "because", "since", "so that", "the same reasoning as X";
- technique — HOW to match, parse or store is the brief's job. "The value falls back to the site default when the user setting is unset" is an outcome; "read with `array_key_exists()` rather than `isset()`" is a technique note. Keep the outcome and its counter-example, drop the note;
- negative parentheticals — "(not an `id`)", "(not the raw response)", "rather than assumed to be the first entry". State what it IS;
- restatements — name the thing once, in the bullet that defines when it happens. Never add "the selector is named X";
- work that is not being done — "no new setting is registered", "no Storybook story is added", "no migration needed". Silence says it;
- "Out of scope" and "Known limitations" lists — the list form names work instead of behavior and cannot be graded.

THE SCOPE BOUNDARY LIVES IN THE CRITERIA, because they are the contract the PR is graded against — not as a clause in the description, which nothing is graded against. Write it as the outcome at the edge: "the button renders on the single product template, and the cart and checkout pages render nothing", not "Out of scope: cart and checkout". A boundary with no observable edge is not one the issue needs.

KEEP the negatives that are themselves assertable outcomes: "the notification is not rendered when ...", "an unconnected module contributes nothing", "the legacy option is not written", "the payload carries the slug and nothing else".

--- PHASE 8: REPORT WHAT DID NOT GO IN THE ISSUE ---

In your reply to the user — not in the issue — report which type you wrote when you had to ask; the decisions you had to make because the design doc was silent (flagged as decisions, so the user can overrule them); discrepancies between the design doc and the code, with the `file:line` you checked; for a bug, the cause you found with its `file:line`, anything in the report you could not confirm in the code, and the environment facts you left blank; anything you added beyond the design doc's scope; and any ordering constraint, when one issue's text refers to another's deliverable by name.

Begin with Phase 1.
"""
