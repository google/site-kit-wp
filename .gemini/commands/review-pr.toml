description = "Reviews a GitHub pull request against its linked issue, the project conventions, and the quality rubric"

prompt = """
You are reviewing GitHub pull request #{{args}} from the google/site-kit-wp repository. You orchestrate the read-only @code-reviewer subagent and synthesize the final review.

The canonical, tool-agnostic procedure is `docs/context/workflow/review-pr.md` and the shared review rubric is `docs/context/workflow/review-checklist.md`. Follow them; the phases below define how you orchestrate the review.

--- CRITICAL INSTRUCTIONS ---

- This is a READ-ONLY review — DO NOT post comments, approve, request changes, or change the PR state on GitHub
- DO NOT create commits or push to remote
- The review is fundamentally a check of the diff AGAINST the linked issue, not just against conventions

--- PHASE 1: FETCH THE PR ---

Fetch PR #{{args}} from `google/site-kit-wp`:
- `!{gh pr view {{args}} --json number,title,body,author,baseRefName,headRefName,files,additions,deletions,commits}`
- `!{gh pr diff {{args}}}`

To give the reviewer full-file context, check out the branch locally: `!{gh pr checkout {{args}}}`.

**STOP and report** if: the PR is not found, the API is unavailable, or the diff is empty.

--- PHASE 2: READ THE LINKED ISSUE ---

Site Kit PRs use `.github/PULL_REQUEST_TEMPLATE.md`, whose **Summary** section links the issue under "Addresses issue:":

```
## Summary
Addresses issue:

- #<number>
```

Extract the first `#<number>` from the PR body and fetch the issue using the GitHub MCP tools (`issue_read`).
Fallback: `!{gh issue view <number> --json title,body,labels}`.

Extract:
1. **Acceptance criteria** (between `## Acceptance criteria` and `## Implementation Brief`)
2. **Implementation Brief** (between `## Implementation Brief` and `### Test Coverage`)
3. **Test Coverage** (between `### Test Coverage` and `## QA Brief`)

This is the spec the PR must satisfy. If the PR body has **no** linked issue (the `- #` line is empty), note it, treat requirements adherence as "not verifiable", and review conventions + code quality only — do not invent acceptance criteria.

--- PHASE 3: DELEGATE THE REVIEW ---

Delegate to @code-reviewer with the following message:

"Review pull request #{{args}}: [PR title].

This is a PR review. Read the changed files (listed below, now checked out locally) and verify them against the acceptance criteria, Implementation Brief, and project conventions.

ACCEPTANCE CRITERIA:
[paste extracted acceptance criteria, or 'No linked issue — review conventions and code quality only']

IMPLEMENTATION BRIEF:
[paste extracted Implementation Brief]

CHANGED FILES:
[paste the `files` list from Phase 1]

DIFF:
[paste the `gh pr diff` output]"

Extract the **score**, **requirements violations**, **context violations**, and **quality recommendations** from the review results.

--- PHASE 4: PRODUCE THE REVIEW ---

Synthesize the reviewer's findings into the structured review defined by `docs/context/workflow/review-pr.md`. Omit any section with nothing to report.

```
### PR #{{args}} — [title]

**Author**: [author] | **Branch**: `[head]` → `[base]` | **Size**: +[additions] / -[deletions]

#### Summary
[One paragraph: what the PR does, what areas it touches, and the linked issue (#<number>) or that none is linked.]

#### Requirements Adherence
[Only when an issue is linked. For each Acceptance criterion and Implementation Brief checkbox: ✅ met / ⚠️ partial / ❌ missing, with the file:line that satisfies it or what's absent. Note any Test Coverage item without a corresponding test.]

#### Principles Compliance
[Per area touched: ✅ / ⚠️ / ❌ with file:line and the context doc + section, from the reviewer's context violations.]

#### Code Quality Issues
[Bugs, logic errors, edge cases with file:line.]

#### Security Concerns
[XSS, capability checks, nonce verification, direct SQL, sanitization.]

#### Performance
[Re-renders, memoization, expensive selectors, N+1 queries, large assets.]

#### Test Coverage
[Changed logic lacking tests, or tests not updated for new behavior.]

#### Minor / Nits
[Optional style/naming/docs improvements.]

#### Verdict
**APPROVE** / **REQUEST CHANGES** / **NEEDS DISCUSSION**
[Brief justification. If requesting changes, list blocking issues as a numbered checklist.]
```

Begin with Phase 1: Fetch PR #{{args}}.
"""
