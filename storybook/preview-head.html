<script>
	// The bundle reads `_googlesitekitBaseData.enabledFeatures` while it
	// loads, so the flags have to be set first. The visual tests pass them in
	// the `features` query parameter. The Storybook app stores them in session
	// storage through `storybook/utils/reloadForFeatures.ts`.
	( function () {
		var STORAGE_KEY = 'googlesitekit-storybook-features';
		var urlFeatures = new URLSearchParams( window.location.search ).get(
			'features'
		);
		var features = urlFeatures ? urlFeatures.split( ',' ) : [];

		try {
			if ( urlFeatures === null ) {
				var storedFeatures =
					window.sessionStorage.getItem( STORAGE_KEY );
				features = storedFeatures ? JSON.parse( storedFeatures ) : [];
			} else {
				window.sessionStorage.setItem(
					STORAGE_KEY,
					JSON.stringify( features )
				);
			}
		} catch ( error ) {
			// Without session storage, only the query parameter sets the flags.
		}

		window._googlesitekitBaseData = { enabledFeatures: features };
	} )();
</script>
