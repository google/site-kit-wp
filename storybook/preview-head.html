<script>
	// The bundle reads `_googlesitekitBaseData.enabledFeatures` at
	// module-evaluation time, so the flags have to be set first.
	( function () {
		var FEATURES_STORAGE_KEY = 'googlesitekit-storybook-features';
		var urlFeatures = new URLSearchParams( window.location.search ).get(
			'features'
		);
		var features = urlFeatures ? urlFeatures.split( ',' ) : [];

		try {
			if ( urlFeatures === null ) {
				var storedFeatures =
					window.sessionStorage.getItem( FEATURES_STORAGE_KEY );
				features = storedFeatures ? JSON.parse( storedFeatures ) : [];
			} else {
				window.sessionStorage.setItem(
					FEATURES_STORAGE_KEY,
					JSON.stringify( features )
				);
			}
		} catch ( error ) {
			// Without session storage, only the `features` query parameter sets
			// the flags.
		}

		window._googlesitekitBaseData = { enabledFeatures: features };
	} )();
</script>
