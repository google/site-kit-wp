# Serves the triage viewer and proxies Loki from the same origin, so the page
# can query it without CORS. Nothing here is production-shaped; it exists only
# so the PoC has a UI that is not Grafana.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /loki/ {
        proxy_pass http://lgtm:3100/loki/;
    }
}
