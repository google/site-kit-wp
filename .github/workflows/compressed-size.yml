name: Compressed Size

on:
  pull_request:
    branches:
      - develop
      - main
      - 'feature/**'
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - '.github/workflows/compressed-size.yml'
      - 'assets/**/*.js'
      - 'assets/**/*.jsx'
      - 'assets/**/*.ts'
      - 'assets/**/*.tsx'
      - 'assets/**/*.json'
      - '!assets/**/*.test.js'
      - '!assets/**/*.test.jsx'
      - '!assets/**/*.test.ts'
      - '!assets/**/*.test.tsx'
      - '!assets/**/*.stories.js'
      - '!assets/**/*.stories.jsx'
      - '!assets/**/*.stories.ts'
      - '!assets/**/*.stories.tsx'
      - '!assets/**/test/**'
      - 'assets/**/*.scss'
      - 'assets/svg/**/*.svg'
      - '**/*.config.js'
      - 'webpack/**/*.js'
      - 'package.json'
      - 'package-lock.json'
      - 'patches/**/*.patch'

concurrency:
  group: compressed-size-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event.pull_request.draft == false
    permissions:
      pull-requests: write
    steps:
      - name: Upgrade ca-certificates
        # Temporary: the runner images trust some distrusted CAs. Remove once
        # GitHub's runner images ship an up-to-date ca-certificates package.
        run: |
          sudo apt-get update
          sudo apt-get install --yes --only-upgrade ca-certificates

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # ratchet:actions/checkout@v6

      - name: Setup Node.js (.nvmrc)
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # ratchet:actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: preactjs/compressed-size-action@f322c295dde06a1cb7ccaef105732dd8a726d1d9 # ratchet:preactjs/compressed-size-action@v2
        with:
          install-script: npm ci --workspace=assets --include-workspace-root
          repo-token: '${{ secrets.GITHUB_TOKEN }}'
          pattern: './dist/assets/**/*.{css,js}'
          # The sub-match below will be replaced by asterisks.
          # The length of 20 corresponds to webpack's `output.hashDigestLength`.
          strip-hash: "([a-f0-9]{20})(?:\\.min)?\\.(?:css|js)$"
          minimum-change-threshold: 1000 # 1KB
