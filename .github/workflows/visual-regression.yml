name: Visual Regression Testing

on:
    pull_request:
        branches:
            - main
            - develop
            - 'feature/**'
        # Only run if CSS/JS related files changed.
        paths:
            - '.github/workflows/visual-regression.yml'
            - 'assets/**'
            - '!assets/**/__tests__/**/*.js'
            - '!assets/**/test/*.js'
            - '!assets/**/*.test.js'
            - '**.stories.js'
            - 'tests/backstop/**'
            - 'storybook/**'
            - '**.scss'
            - '.nvmrc'
            - '**/package.json'
            - 'package-lock.json'
        types:
            - opened
            - reopened
            - synchronize
            - ready_for_review
            - closed

concurrency:
    group: visual-regression-${{ github.ref }}
    cancel-in-progress: true

env:
    GCS_ROOT_PATH: vrt
    CAN_UPLOAD_VRT_REPORTS: ${{ github.event_name != 'pull_request' || ( ! contains( github.head_ref, 'dependabot/' ) && github.event.pull_request.head.repo.fork == false ) }}

jobs:
    visual-regression:
        name: Run VR Tests
        runs-on: ubuntu-latest
        timeout-minutes: 30
        if: github.event.pull_request.draft == false && github.event.action != 'closed'
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
            - name: Setup Node.js (.nvmrc)
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # ratchet:actions/setup-node@v6
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - name: npm install
              run: npm ci -w assets -w tests/backstop -w storybook -w tests/js --include-workspace-root
            - name: Log in to GitHub Container Registry
              uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # ratchet:docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: google-site-kit-bot
                  password: ${{ secrets.GH_BOT_TOKEN }}
            - name: Run Backstopjs
              id: run-backstopjs
              run: npm run test:visualtest
            - name: Upload artifacts
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # ratchet:actions/upload-artifact@v6
              if: always()
              with:
                  name: vrt-report
                  path: |
                      tests/backstop/ci_report
                      tests/backstop/html_report
                      tests/backstop/json_report
                      tests/backstop/reference
                      tests/backstop/tests

            - name: Set report target directory
              id: report-target
              if: always() && env.CAN_UPLOAD_VRT_REPORTS == 'true'
              run: |
                  if [[ "${{ github.event_name }}" == "pull_request" ]]; then
                    echo "dir=pull/${{ github.event.number }}" >> "$GITHUB_OUTPUT"
                  else
                    echo "dir=${GITHUB_REF##*/}" >> "$GITHUB_OUTPUT"
                  fi

            - uses: ./.github/actions/upload-to-gcs
              id: upload-to-gcs
              if: always() && env.CAN_UPLOAD_VRT_REPORTS == 'true'
              with:
                  credentials-json: ${{ secrets.GCP_CREDENTIALS }}
                  path: tests/backstop/html_report
                  destination: ${{ env.GCS_ROOT_PATH }}/${{ steps.report-target.outputs.dir }}

            - name: Save report URL
              if: always() && env.CAN_UPLOAD_VRT_REPORTS == 'true'
              run: |
                  mkdir -p /tmp/artifact-url
                  if [ "${{ steps.run-backstopjs.outcome }}" == "success" ]; then
                    echo "- ✅ [VRT Report](${{ steps.upload-to-gcs.outputs.public-url }}/index.html)" > /tmp/artifact-url/url.md
                  else
                    echo "- ❌ [VRT Report](${{ steps.upload-to-gcs.outputs.public-url }}/index.html)" > /tmp/artifact-url/url.md
                  fi

            - name: Upload report URL
              if: always() && env.CAN_UPLOAD_VRT_REPORTS == 'true'
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # ratchet:actions/upload-artifact@v6
              with:
                  name: artifact-url-vrt
                  path: /tmp/artifact-url/url.md

    add-comment-to-pr:
        name: Add comment to PR
        runs-on: ubuntu-latest
        needs: visual-regression
        if: always() && github.event_name == 'pull_request' && ! contains( github.head_ref, 'dependabot/' ) && github.event.pull_request.head.repo.fork == false && github.event.action != 'closed'
        permissions:
            contents: read
            pull-requests: write
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6

            - name: Download artifact URL
              uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # ratchet:actions/download-artifact@v7
              with:
                  name: artifact-url-vrt
                  path: /tmp/artifact-url/

            - name: Build comment body
              id: build-comment
              run: |
                  {
                    echo 'body<<EOF'
                    echo '🖼️ **VRT report for ${{ github.event.pull_request.head.sha }}:**'
                    cat /tmp/artifact-url/url.md
                    echo EOF
                  } >> "$GITHUB_OUTPUT"

            - uses: ./.github/actions/update-pr-comment
              with:
                  issue-number: ${{ github.event.pull_request.number }}
                  section-id: vrt
                  section-content: ${{ steps.build-comment.outputs.body }}

    remove-vrt-reports:
        name: Remove VRT reports
        runs-on: ubuntu-latest
        if: github.event_name == 'pull_request' && github.event.action == 'closed'
        permissions:
            contents: read
            pull-requests: write
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6

            - uses: ./.github/actions/remove-gcs-path
              with:
                  credentials-json: ${{ secrets.GCP_CREDENTIALS }}
                  path: ${{ env.GCS_ROOT_PATH }}/pull/${{ github.event.pull_request.number }}

            - uses: ./.github/actions/update-pr-comment
              with:
                  issue-number: ${{ github.event.pull_request.number }}
                  section-id: vrt
                  section-content: |
                      🖼️ **VRT report for ${{ github.event.pull_request.head.sha }}:**
                      - Reports have been deleted.
