name: Visual Regression Testing

on:
  pull_request:
    branches:
      - main
      - develop
      - 'feature/**'
    # Only run if CSS/JS related files changed.
    paths:
      - '.github/workflows/visual-regression.yml'
      - '.github/actions/**'
      - 'assets/**'
      - '!assets/**/__tests__/**/*.js'
      - '!assets/**/test/*.js'
      - '!assets/**/*.test.js'
      - '**.stories.js'
      - '**.stories.tsx'
      - 'tests/js/**'
      - 'tests/vrt/**'
      - 'storybook/**'
      - 'webpack/**'
      - '**.scss'
      - '.nvmrc'
      - '**/package.json'
      - 'package-lock.json'
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - closed
  # Catch reference images that no longer match after two PRs merge.
  push:
    branches:
      - main
      - develop
    paths:
      - '.github/workflows/visual-regression.yml'
      - 'assets/**'
      - 'tests/js/**'
      - 'tests/vrt/**'
      - 'storybook/**'
      - 'webpack/**'
      - '**.scss'
      - '.nvmrc'
      - '**/package.json'
      - 'package-lock.json'
  workflow_dispatch:
    inputs:
      repeat_each:
        description: Run each test this many times, to find flaky stories.
        required: false
        default: '1'

concurrency:
  group: visual-regression-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GCS_ROOT_PATH: vrt
  CAN_UPLOAD_VRT_REPORTS: ${{ github.event_name != 'pull_request' || ( ! contains( github.head_ref, 'dependabot/' ) && github.event.pull_request.head.repo.fork == false ) }}

jobs:
  build:
    name: Build Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'pull_request' || ( github.event.pull_request.draft == false && github.event.action != 'closed' )
    outputs:
      playwright-version: ${{ steps.playwright.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Node.js (.nvmrc)
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # ratchet:actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: npm install
        run: npm ci -w assets -w storybook -w tests/js -w tests/vrt --include-workspace-root
      - name: Build Storybook
        run: VRT=1 npm run build:storybook
      # Fails early on scenarios whose story isn't in the build. Missing and
      # orphaned reference images are checked after the report, so new and
      # renamed stories still render and appear in it.
      - name: Check scenarios against the Storybook build
        run: node tests/vrt/bin/check-snapshots.js --build-only
      - name: Get Playwright version
        id: playwright
        working-directory: tests/vrt
        run: echo "version=$(node -p "require( '@playwright/test/package.json' ).version")" >> "$GITHUB_OUTPUT"
      - name: Upload Storybook build
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # ratchet:actions/upload-artifact@v6
        with:
          name: storybook-vrt
          path: |
            dist
            !dist/**/*.map
          retention-days: 1

  test:
    name: Run VR Tests (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    # The same image `tests/vrt/bin/vrt` runs locally, so reference images
    # approved locally match these screenshots.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.build.outputs.playwright-version }}-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [ 1, 2, 3, 4 ]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
        with:
          persist-credentials: false
      - name: Download Storybook build
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # ratchet:actions/download-artifact@v7
        with:
          name: storybook-vrt
          path: dist
      - name: npm install
        run: SKIP_PATCH_PACKAGE=1 npm ci -w tests/vrt --ignore-scripts
      - name: Run VR tests
        working-directory: tests/vrt
        env:
          REPEAT_EACH: ${{ github.event.inputs.repeat_each || '1' }}
        run: npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }} --repeat-each="$REPEAT_EACH"
      - name: Upload blob report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # ratchet:actions/upload-artifact@v6
        if: always()
        with:
          name: blob-report-${{ matrix.shard }}
          path: tests/vrt/blob-report
          retention-days: 1

  report:
    name: VRT Report
    runs-on: ubuntu-latest
    needs: [ build, test ]
    if: always() && needs.build.result == 'success'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Node.js (.nvmrc)
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # ratchet:actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: npm install
        run: SKIP_PATCH_PACKAGE=1 npm ci -w tests/vrt --ignore-scripts
      - name: Download blob reports
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # ratchet:actions/download-artifact@v7
        with:
          pattern: blob-report-*
          path: tests/vrt/all-blob-reports
          merge-multiple: true
      # Writes the report (`report/`, with every reference image) and
      # Playwright's report (`report/playwright/`), as configured in
      # `merge.config.js`.
      - name: Merge reports
        working-directory: tests/vrt
        run: npx playwright merge-reports --config merge.config.js ./all-blob-reports
      # A reporter's errors are only logged, so check the report was written.
      - name: Check the report
        id: summary
        working-directory: tests/vrt
        run: |
          test -f report/index.html
          test -f report/data.js
          test -f report/playwright/index.html
          node -e "
            const summary = require( './report/summary.json' );
            for ( const [ key, value ] of Object.entries( summary ) ) {
              console.log( key + '=' + value );
            }
          " >> "$GITHUB_OUTPUT"
      - name: Upload report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # ratchet:actions/upload-artifact@v6
        with:
          name: vrt-report
          path: tests/vrt/report
          retention-days: 14

      - name: Set report target directory
        id: report-target
        if: env.CAN_UPLOAD_VRT_REPORTS == 'true'
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "dir=pull/${{ github.event.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "dir=${GITHUB_REF##*/}" >> "$GITHUB_OUTPUT"
          fi

      # Clear the PR's previous report, so files from earlier runs don't pile
      # up. It fails when there's nothing to remove yet, e.g. on the first run.
      - uses: ./.github/actions/remove-gcs-path
        if: env.CAN_UPLOAD_VRT_REPORTS == 'true' && github.event_name == 'pull_request'
        continue-on-error: true
        with:
          credentials-json: ${{ secrets.GCP_CREDENTIALS }}
          path: ${{ env.GCS_ROOT_PATH }}/${{ steps.report-target.outputs.dir }}

      - uses: ./.github/actions/upload-to-gcs
        id: upload-to-gcs
        if: env.CAN_UPLOAD_VRT_REPORTS == 'true'
        with:
          credentials-json: ${{ secrets.GCP_CREDENTIALS }}
          path: tests/vrt/report
          destination: ${{ env.GCS_ROOT_PATH }}/${{ steps.report-target.outputs.dir }}

      - name: Save report summary
        if: env.CAN_UPLOAD_VRT_REPORTS == 'true'
        env:
          TEST_RESULT: ${{ needs.test.result }}
          REPORT_URL: ${{ steps.upload-to-gcs.outputs.public-url }}
          FAILED: ${{ steps.summary.outputs.failed }}
          NEW: ${{ steps.summary.outputs.new }}
          FLAKY: ${{ steps.summary.outputs.flaky }}
          NOT_RUN: ${{ steps.summary.outputs.notRun }}
          PASSED: ${{ steps.summary.outputs.passed }}
        run: |
          mkdir -p /tmp/artifact-url
          if [ "${TEST_RESULT}" == "success" ]; then
            ICON="✅"
          else
            ICON="❌"
          fi
          COUNTS="${FAILED:-0} failed, ${NEW:-0} new, ${FLAKY:-0} flaky, ${PASSED:-0} passed"
          if [ "${NOT_RUN:-0}" != "0" ]; then
            COUNTS="${COUNTS}, ${NOT_RUN} not run"
          fi
          {
            echo "- ${ICON} [VRT report](${REPORT_URL}/index.html): ${COUNTS}. ([Playwright details](${REPORT_URL}/playwright/index.html))"
            if [ "${TEST_RESULT}" != "success" ]; then
              echo "- To accept intended changes, copy the command shown for each story in the report and commit the images, or add the \`VRT: Update reference images\` label."
            fi
          } > /tmp/artifact-url/url.md

      - name: Upload report summary
        if: env.CAN_UPLOAD_VRT_REPORTS == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # ratchet:actions/upload-artifact@v6
        with:
          name: artifact-url-vrt
          path: /tmp/artifact-url/url.md

      # The report job only summarizes; fail the run when the tests failed, or
      # when reference images are missing or orphaned (e.g. a renamed story).
      - name: Check reference images
        run: node tests/vrt/bin/check-snapshots.js

      - name: Check test result
        if: needs.test.result != 'success'
        run: exit 1

  add-comment-to-pr:
    name: Add comment to PR
    runs-on: ubuntu-latest
    needs: report
    if: always() && github.event_name == 'pull_request' && ! contains( github.head_ref, 'dependabot/' ) && github.event.pull_request.head.repo.fork == false && github.event.action != 'closed' && needs.report.result != 'skipped'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6

      - name: Download artifact URL
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # ratchet:actions/download-artifact@v7
        with:
          name: artifact-url-vrt
          path: /tmp/artifact-url/

      - name: Build comment body
        id: build-comment
        run: |
          {
            echo 'body<<EOF'
            echo '🖼️ **VRT report for ${{ github.event.pull_request.head.sha }}:**'
            cat /tmp/artifact-url/url.md
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/update-pr-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          section-id: vrt
          section-content: ${{ steps.build-comment.outputs.body }}

  remove-vrt-reports:
    name: Remove VRT reports
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6

      - uses: ./.github/actions/remove-gcs-path
        with:
          credentials-json: ${{ secrets.GCP_CREDENTIALS }}
          path: ${{ env.GCS_ROOT_PATH }}/pull/${{ github.event.pull_request.number }}

      - uses: ./.github/actions/update-pr-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          section-id: vrt
          section-content: |
            🖼️ **VRT report for ${{ github.event.pull_request.head.sha }}:**
            - Reports have been deleted.
