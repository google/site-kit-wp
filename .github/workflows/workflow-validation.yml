name: Workflow Validation

on:
  pull_request:
    paths:
      - '.github/**.ya?ml'

permissions:
  contents: read

concurrency:
  group: workflow-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-actions:
    name: Lint Actions
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Upgrade ca-certificates
        # Temporary: the runner images trust some distrusted CAs. Remove once
        # GitHub's runner images ship an up-to-date ca-certificates package.
        run: |
          sudo apt-get update
          sudo apt-get install --yes --only-upgrade ca-certificates

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # ratchet:actions/checkout@v6
      - id: github-yaml-files
        run: echo "files=$(find .github/ \( -name '*.yml' -o -name '*.yaml' \) -print0 | xargs -0)" >> "$GITHUB_OUTPUT"
      # Excluded so the commit and `version` (v0.12.0) are only updated
      # together, here and in update-pinned-actions.yml.
      - uses: sethvargo/ratchet@9ca118155b0f79464185703a50da367e111107cd # ratchet:exclude
        with:
          version: v0.12.0
          files: ${{ steps.github-yaml-files.outputs.files }}
      - uses: reviewdog/action-actionlint@6fb7acc99f4a1008869fa8a0f09cfca740837d9d # ratchet:reviewdog/action-actionlint@v1
        env:
          REVIEWDOG_GITHUB_API_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          # Neither inline shellcheck nor `actionlint_flags`
          # disable a rule, so this must be disabled using
          # an env variable.
          SHELLCHECK_OPTS: "-e SC2129"
