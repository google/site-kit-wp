name: Check for Release

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  check-issue-has-release:
    name: Issue must have a ZenHub release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Approvals from people with repo access, on same-repo PRs only.
    # `full_name` is reliable where `fork` can be null.
    if: >-
      github.event.review.state == 'approved' &&
      contains( fromJSON( '["OWNER", "MEMBER", "COLLABORATOR"]' ), github.event.review.author_association ) &&
      github.event.pull_request.head.repo.full_name == github.repository
    # Job level, so skipped runs don't cancel a running check.
    concurrency:
      group: check-issue-has-release-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Upgrade ca-certificates
        # Temporary: the runner images trust some distrusted CAs. Remove once
        # GitHub's runner images ship an up-to-date ca-certificates package.
        run: |
          sudo apt-get update
          sudo apt-get install --yes --only-upgrade ca-certificates

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # ratchet:actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # ratchet:actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Check issue for release tag
        run: ./bin/check-issue-has-release.js
        env:
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || github.event.number }}
          ZENHUB_GQL_API_TOKEN: ${{ secrets.ZENHUB_GQL_API_TOKEN }}
